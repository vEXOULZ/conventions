# Build a static site and publish it, as job `publish` in a site repo's publish.yml:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     publish:
#       uses: vEXOULZ/conventions/.github/workflows/publish-site.yml@v1.0.0
#       permissions:
#         contents: write
#
# It knows nothing about where the site is served: it force-pushes the build output to an orphan branch
# (default `deploy`). Whatever serves the site pulls that branch; that setup is private and lives
# outside these repos. Node comes from .nvmrc.
name: publish-site

on:
  workflow_call:
    inputs:
      build-command:
        type: string
        default: npm run build
      output-dir:
        type: string
        default: dist
      branch:
        type: string
        default: deploy
      checks:
        description: Commands run before the build (typecheck, tests); empty to skip
        type: string
        default: npm run typecheck --if-present && npm run test --if-present

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: inputs.checks != ''
        run: ${{ inputs.checks }}
      - run: ${{ inputs.build-command }}
      - name: Push build to the ${{ inputs.branch }} branch
        env:
          OUT: ${{ inputs.output-dir }}
          BRANCH: ${{ inputs.branch }}
          TOKEN: ${{ github.token }}
        run: |
          cd "$OUT"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${GITHUB_SHA}" > .source-commit
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
